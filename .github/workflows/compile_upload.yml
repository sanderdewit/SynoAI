name: Build

# Dependency updates come from Dependabot (.github/dependabot.yml) as pull requests.
# This workflow only builds and tests them, and publishes the image from main.

on:
  # Weekly rebuild so the published image picks up patched .NET runtime and OS
  # layers from the mcr.microsoft.com/dotnet/aspnet:10.0 tag (refreshed monthly).
  schedule:
    - cron: '15 2 * * 3'
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.x

      # Locked mode fails the build if a .csproj and its packages.lock.json disagree.
      - name: Restore dependencies
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --no-restore

      - name: Test
        run: dotnet run --project SynoAI.Tests/SynoAI.Tests.csproj --no-build

  publish:
    needs: build
    # Never publish :latest from a pull request.
    if: ${{ github.event_name != 'pull_request' && github.ref_name == 'main' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Build the Docker image
        run: docker build --pull -t dewitauto/synoai-fork:latest SynoAI

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish the Docker image
        run: docker push dewitauto/synoai-fork:latest
